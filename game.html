<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Things | Multiplication Shooter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5fb;color:#22243d;font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}main{max-width:1100px;margin:auto;background:white;border:1px solid #e4e5f2;border-radius:24px;padding:clamp(20px,5vw,56px);box-shadow:0 12px 40px #2222}h1{font-size:clamp(32px,5vw,54px);margin:12px 0 30px}.eyebrow{color:#6854df;font-weight:800;letter-spacing:2px}.label{font-weight:750;margin:28px 0 12px;display:block}.choices{display:flex;flex-wrap:wrap;gap:10px}.btn,select{border:1px solid #e2e3f0;background:#f4f3fb;color:#24243d;border-radius:12px;padding:13px 20px;font:inherit;cursor:pointer;touch-action:manipulation}.btn.selected{background:#e9e6ff;border:2px solid #6854df;color:#6854df;font-weight:800}.btn:hover{filter:brightness(.97)}.preview{margin-top:24px;background:#202f4c;min-height:140px;border-radius:18px;display:grid;place-items:center;position:relative;color:#ff4d6d}.cross{font-size:50px;font-weight:200}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.row label{font-weight:700}.row select{width:100%;margin-top:8px;background:white}.primary{display:block;width:100%;margin-top:32px;background:#6854df;color:white;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800;cursor:pointer;touch-action:manipulation}.primary:active,.btn:active{transform:scale(.98)}#play{display:none}.board{background:#202f4c;color:white;border-radius:18px;padding:20px;margin-top:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{height:min(55vh,480px);min-height:320px;background:#17243c;border:1px solid #40506d;border-radius:16px;margin-top:18px;position:relative;overflow:hidden;touch-action:manipulation}.target{position:absolute;border:0;border-radius:50%;background:#ffca55;color:#1d2440;font-weight:900;font-size:20px;width:64px;height:64px;cursor:pointer;box-shadow:0 0 20px #ffca5577;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#17243ce8;z-index:5}.overlay>div{text-align:center;padding:28px}.overlay button{max-width:300px}.hidden{display:none!important}.stats{display:flex;gap:24px;margin-top:12px}.stats b{font-size:22px}.small{color:#737895}@media(max-width:650px){body{padding:10px}main{padding:20px}.row{grid-template-columns:1fr}.field{min-height:280px}}
</style></head><body><main>
<a href="/" style="color:#777d9b;text-decoration:none;font-weight:700">← Tutor Things</a><p class="eyebrow">GAME TEST MODE</p><h1>Multiplication Shooter</h1>
<section id="setup"><span class="label">Choose your tables</span><div class="choices" id="tables"></div><span class="label">Target movement</span><div class="choices"><button class="btn selected" data-mode="random">Random spawning</button><button class="btn" data-mode="gliding">Gliding targets</button></div><span class="label">Number of questions</span><div class="choices"><button class="btn selected" data-count="10">10</button><button class="btn" data-count="50">50</button><button class="btn" data-count="100">100</button></div>
<div class="row" style="margin-top:24px"><label>Pointer color<select id="color"><option value="#ff4d6d">Pink</option><option value="#55d6ff">Blue</option><option value="#7cff8a">Green</option><option value="#ffffff">White</option></select></label><label>Pointer size<select id="size"><option value="24">Small</option><option value="34" selected>Medium</option><option value="46">Large</option></select></label><label>Pointer style<select id="style"><option value="cross">Crosshair</option><option value="circle">Circle</option><option value="dot">Dot</option></select></label></div><div class="preview" id="preview"><span id="aim" class="cross">＋</span></div><button class="primary" id="start">Start shooting 🚀</button></section>
<section id="play"><div class="board"><div class="top"><span id="qnum">Question 1</span><span>Score: <b id="score">0</b></span></div><h2 id="question">2 × 3 = ?</h2><p>Click the correct answer target!</p><div class="stats">Shots <b id="shots">0</b> · Hits <b id="hits">0</b> · Streak <b id="streak">0</b></div></div><div class="field" id="field"><div class="overlay" id="overlay"><div><h2 id="overlayTitle">Ready?</h2><p id="overlayText">Click start when you're ready.</p><button class="primary" id="overlayButton">Start game</button></div></div></div><button class="primary" id="quit">Back to setup</button></section>
</main><script>
(() => {
  const $ = id => document.getElementById(id);
  let selectedTables = ['mix'], questionCount = 10, movement = 'random';
  let questions = [], current = 0, score = 0, shots = 0, hits = 0, streak = 0, timer = null;
  const tableContainer = $('tables');

  function renderTables() {
    tableContainer.innerHTML = '';
    for (let n=2;n<=20;n++) {
      const button=document.createElement('button');
      button.type='button'; button.className='btn'; button.textContent=n;
      button.classList.toggle('selected',selectedTables.includes(n));
      button.addEventListener('click',()=>{
        selectedTables=selectedTables.filter(x=>x!=='mix');
        if(selectedTables.includes(n)) selectedTables=selectedTables.filter(x=>x!==n);
        else selectedTables.push(n);
        if(!selectedTables.length) selectedTables=['mix'];
        renderTables();
      });
      tableContainer.appendChild(button);
    }
    const mix=document.createElement('button');
    mix.type='button';mix.className='btn';mix.textContent='Mix all tables (2–20)';
    mix.classList.toggle('selected',selectedTables.includes('mix'));
    mix.addEventListener('click',()=>{selectedTables=['mix'];renderTables();});
    tableContainer.appendChild(mix);
  }
  renderTables();

  document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
    movement=button.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b===button));
  }));
  document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{
    questionCount=Number(button.dataset.count);
    document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('selected',b===button));
  }));
  function updatePointer(){
    const aim=$('aim'); aim.style.color=$('color').value; aim.style.fontSize=$('size').value+'px';
    aim.textContent=$('style').value==='dot'?'●':$('style').value==='circle'?'◯':'＋';
  }
  ['color','size','style'].forEach(id=>$(id).addEventListener('change',updatePointer));
  updatePointer();
  function makeQuestion(){
    const tables=selectedTables.includes('mix')?Array.from({length:19},(_,i)=>i+2):selectedTables;
    const a=tables[Math.floor(Math.random()*tables.length)],b=1+Math.floor(Math.random()*12);
    return {a,b,answer:a*b};
  }
  function start(){
    clearInterval(timer); questions=Array.from({length:questionCount},makeQuestion);
    current=0;score=shots=hits=streak=0;
    $('setup').style.display='none';$('play').style.display='block';ready();
  }
  function ready(){
    $('overlay').classList.remove('hidden');$('overlayTitle').textContent='Ready?';
    $('overlayText').textContent='Click start when you are ready.';$('overlayButton').textContent='Start game';
    $('overlayButton').onclick=()=>{$('overlay').classList.add('hidden');nextQuestion();};
  }
  function updateStats(){
    $('score').textContent=score;$('shots').textContent=shots;$('hits').textContent=hits;$('streak').textContent=streak;
  }
  function nextQuestion(){
    clearInterval(timer);
    if(current>=questions.length){finish();return;}
    const q=questions[current];$('qnum').textContent='Question '+(current+1)+' / '+questionCount;
    $('question').textContent=q.a+' × '+q.b+' = ?';
    document.querySelectorAll('.target').forEach(t=>t.remove());
    const answers=new Set([q.answer]);
    while(answers.size<6) answers.add(Math.max(1,q.answer+Math.floor(Math.random()*31)-15));
    [...answers].sort(()=>Math.random()-.5).forEach(value=>{
      const target=document.createElement('button');target.type='button';target.className='target';target.textContent=value;
      target.style.left=Math.random()*82+'%';target.style.top=Math.random()*75+'%';
      target.addEventListener('click',()=>{
        shots++;
        if(value===q.answer){hits++;score+=100+streak*10;streak++;target.textContent='✓';target.style.background='#7cff8a';updateStats();setTimeout(()=>{current++;nextQuestion();},350);}
        else{streak=0;target.style.background='#ff6b6b';target.disabled=true;updateStats();}
      });
      $('field').appendChild(target);
    });
    if(movement==='gliding') timer=setInterval(()=>document.querySelectorAll('.target:not(:disabled)').forEach(t=>{
      t.style.left=Math.max(0,Math.min(82,parseFloat(t.style.left)+(Math.random()*4-2)))+'%';
      t.style.top=Math.max(0,Math.min(75,parseFloat(t.style.top)+(Math.random()*4-2)))+'%';
    }),180);
  }
  function finish(){
    clearInterval(timer);$('overlay').classList.remove('hidden');$('overlayTitle').textContent='Game complete!';
    $('overlayText').textContent='Score: '+score+' · Accuracy: '+(shots?Math.round(hits/shots*100):0)+'%';
    $('overlayButton').textContent='Play again';$('overlayButton').onclick=start;
  }
  $('start').addEventListener('click',start);
  $('quit').addEventListener('click',()=>{clearInterval(timer);$('play').style.display='none';$('setup').style.display='block';});
})();
</script></body></html>
